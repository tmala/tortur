<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Map Grid subtle lines -->
  <path d="M 64 160 L 448 160 M 64 256 L 448 256 M 64 352 L 448 352" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M 160 64 L 160 448 M 256 64 L 256 448 M 352 64 L 352 448" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Pulsing radar circle -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>
  <circle cx="256" cy="240" r="90" fill="#ffffff" fill-opacity="0.1"/>
  
  <!-- Location Pin -->
  <g filter="url(#glow)">
    <path d="M256 100 C185 100 128 157 128 228 C128 320 256 420 256 420 C256 420 384 320 384 228 C384 157 327 100 256 100 Z" fill="white"/>
    <circle cx="256" cy="228" r="48" fill="#0284c7"/>
